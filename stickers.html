<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sticker Collection — Indigo Museum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-page="stickers">
  <main class="stickers container">
    <section class="gallery-intro" style="min-height: 60vh;">
      <div class="gallery-intro__inner">
        <div class="gallery-intro__num" data-anim="fade-slow">Gift Shop</div>
        <h1 class="gallery-intro__title" data-anim="blur-reveal">Sticker<br>Collection</h1>
        <p class="gallery-intro__sub" data-anim="fade-slow" data-anim-delay="2">Take one home. Or twelve.</p>
      </div>
    </section>

    <section>
      <div class="center" style="max-width:640px; margin:0 auto var(--gap-lg);" data-anim="rise">
        <div class="eyebrow">How to collect</div>
        <p style="margin: 1rem auto 0;">Click any sticker to zoom, then download the PNG. Free to use for personal, non-commercial fan enjoyment.</p>
      </div>

      <div class="sticker-grid" id="stickerGrid"></div>
    </section>

    <div class="modal sticker-modal" id="stickerModal">
      <div class="modal__panel" style="max-width:520px; text-align:center;">
        <button class="modal__close" data-close>×</button>
        <div class="eyebrow" style="margin-bottom:1rem;">Preview</div>
        <div id="stickerModalContent"></div>
        <a class="btn mt-md" id="stickerDownload" download>
          <span>Download PNG</span>
          <span class="btn-arrow">↓</span>
        </a>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.42/bundled/lenis.min.js"></script>
  <script src="js/animation.js"></script>
  <script src="js/stamps.js"></script>
  <script src="js/app.js"></script>

  <script>
    const STICKERS = ['01', '02', '03', '04', '05', '06', '07', '08', '09', '10', '12', '13'].map((id) => ({
      id,
      src: `assets/images/sticker${id}.jpeg`,
      label: `Sticker ${id}`,
    }));

    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('stickerGrid');

      STICKERS.forEach((s, i) => {
        const el = document.createElement('button');
        el.className = 'sticker';
        el.setAttribute('data-artwork', '');
        el.setAttribute('data-anim', 'scale-in');
        el.setAttribute('data-anim-delay', String(Math.min((i % 6) + 1, 6)));
        el.title = s.label;
        el.innerHTML = `
          <img src="${s.src}" alt="${s.label}" loading="lazy" decoding="async" onerror="this.replaceWith(placeholderSVG(${i}))">
        `;
        el.addEventListener('click', () => openSticker(s));
        grid.appendChild(el);
      });
      Animation.observe();

      // Fallback SVG for missing sticker files
      window.placeholderSVG = (i) => {
        const wrap = document.createElement('div');
        const hue = (i * 41) % 360;
        wrap.innerHTML = `
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">
            <circle cx="50" cy="50" r="46" fill="hsl(${hue}, 40%, 88%)" stroke="var(--navy)" stroke-width="2"/>
            <text x="50" y="46" text-anchor="middle" font-family="var(--font-serif)" font-size="12" fill="var(--navy)">Indigo</text>
            <text x="50" y="62" text-anchor="middle" font-family="var(--font-serif)" font-size="12" fill="var(--navy)">Museum</text>
            <text x="50" y="80" text-anchor="middle" font-family="var(--font-sans)" font-size="7" fill="var(--warm-gray)" letter-spacing="1">STICKER ${String(i + 1).padStart(2, '0')}</text>
          </svg>
        `;
        return wrap.firstElementChild;
      };

      const modal = document.getElementById('stickerModal');
      const modalContent = document.getElementById('stickerModalContent');
      const downloadBtn = document.getElementById('stickerDownload');

      function openSticker(s) {
        modalContent.innerHTML = `<img src="${s.src}" alt="${s.label}" onerror="this.replaceWith(placeholderSVG(${parseInt(s.id, 10) - 1}))" style="max-height:60vh;">`;
        downloadBtn.href = s.src;
        downloadBtn.download = `indigo-museum-sticker-${s.id}.jpg`;
        modal.classList.add('open');
      }

      modal.querySelector('[data-close]').addEventListener('click', () => modal.classList.remove('open'));
      modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });
    });
  </script>
</body>
</html>
