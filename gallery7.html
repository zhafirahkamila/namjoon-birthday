<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery 07 · To Namjoon — Indigo Museum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-page="gallery7">
  <main data-gallery="g7">
    <section class="gallery-intro">
      <div class="gallery-intro__inner">
        <div class="gallery-intro__num" data-anim="fade-slow">Gallery&nbsp;07</div>
        <h1 class="gallery-intro__title" data-anim="blur-reveal">To<br>Namjoon</h1>
        <p class="gallery-intro__sub" data-anim="fade-slow" data-anim-delay="2">A wall for birthday wishes.</p>
      </div>
    </section>

    <section class="guestbook container">
      <form id="guestbookForm" class="guestbook__form" data-anim="rise" autocomplete="off">
        <div class="archived-stamp">ARCHIVED</div>

        <div class="eyebrow center" style="margin-bottom:1rem;">Leave a wish</div>
        <h2 class="h-section center" style="margin-bottom:1.4rem;">Sign the guestbook</h2>

        <div class="guestbook__row">
          <div class="field">
            <label for="name">Name (optional)</label>
            <input type="text" id="name" name="name" maxlength="40" placeholder="Anonymous" />
          </div>
          <div class="field">
            <label for="country">Country (optional)</label>
            <input type="text" id="country" name="country" maxlength="30" placeholder="e.g. KR, US, Brazil" />
          </div>
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" required placeholder="Happy birthday, Namjoon…"></textarea>
          <div class="guestbook__meta">
            <span>Max 300 characters · newest first</span>
            <span class="js-char-count">0/300</span>
          </div>
        </div>

        <div class="guestbook__actions">
          <button type="submit" class="btn">
            <span>Send Wish</span>
            <span class="btn-arrow">→</span>
          </button>
        </div>

        <div class="guestbook__notice" id="guestbookNotice" role="status"></div>
      </form>

      <div class="center" style="margin-bottom: 2rem; margin-top: 5rem;" data-anim="fade-slow">
        <div class="eyebrow">The Wall</div>
        <h2 class="h-section" style="margin-top: 0.5rem;">Messages from around the world</h2>
      </div>

      <div class="guestbook__wall" id="guestbookWall">
        <p style="color: var(--warm-gray); text-align:center; font-style: italic; font-family: var(--font-serif);">Loading messages…</p>
      </div>
    </section>

    <section class="gallery-exit container">
      <div class="eyebrow">End of Gallery 07</div>
      <h2 class="h-section" style="margin: 1rem 0 2rem;">Collect the final stamp</h2>
      <button id="galleryExitBtn" class="btn">
        <span>Collect stamp &amp; unlock the letter</span>
        <span class="btn-arrow">→</span>
      </button>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.42/bundled/lenis.min.js"></script>
  <script src="js/animation.js"></script>
  <script src="js/stamps.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/app.js"></script>
  <script type="module" src="js/guestbook.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => Gallery.initExit('g7', 'letter.html'));
  </script>
</body>
</html>
