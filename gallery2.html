<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery 02 · Words That Shaped Me — Indigo Museum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-page="gallery2">
  <main data-gallery="g2">
    <section class="gallery-intro">
      <div class="gallery-intro__inner">
        <div class="gallery-intro__num" data-anim="fade-slow">Gallery&nbsp;02</div>
        <h1 class="gallery-intro__title" data-anim="blur-reveal">Words That<br>Shaped Me</h1>
        <p class="gallery-intro__sub" data-anim="fade-slow" data-anim-delay="2">Books. Poetry. Thoughts. Quotes.</p>
      </div>
    </section>

    <section class="section container">
      <div class="center" style="max-width:640px; margin:0 auto;" data-anim="rise">
        <div class="eyebrow">The Bookshelf</div>
        <h2 class="h-section" style="margin: 1rem 0;">Pick a spine.</h2>
        <p style="color: var(--warm-gray); margin: 1rem auto;">Each book carries a line that stayed with him. Hover, then click.</p>
      </div>

      <div class="bookshelf" id="bookshelf" data-anim="rise" data-anim-delay="1"></div>

      <div class="quote-reveal" id="quoteReveal">
        <div class="quote-reveal--empty">A quote will appear here.</div>
      </div>
    </section>

    <section class="gallery-exit container">
      <div class="eyebrow">End of Gallery 02</div>
      <h2 class="h-section" style="margin: 1rem 0 2rem;">Continue to Gallery 03 · Beyond The Stage</h2>
      <button id="galleryExitBtn" class="btn">
        <span>Collect stamp &amp; continue</span>
        <span class="btn-arrow">→</span>
      </button>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.42/bundled/lenis.min.js"></script>
  <script src="js/animation.js"></script>
  <script src="js/stamps.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/app.js"></script>

  <script>
    const BOOKS = [
      { title: 'The Wind-Up Bird Chronicle', author: 'Haruki Murakami', color: '#8b3a2e',
        quote: 'Whatever it is you are seeking won\'t come in the form you are expecting.' },
      { title: 'Demian', author: 'Hermann Hesse', color: '#2b3a5c',
        quote: 'The bird fights its way out of the egg. The egg is the world.' },
      { title: 'Kitchen', author: 'Banana Yoshimoto', color: '#c4a45a',
        quote: 'The place I loved most in the world was the kitchen.' },
      { title: 'The Vegetarian', author: 'Han Kang', color: '#4a2d3a',
        quote: 'Trees are like brothers and sisters — they save the last light for each other.' },
      { title: 'Norwegian Wood', author: 'Haruki Murakami', color: '#3e5c3a',
        quote: 'What a terrible thing it is to wound someone you really love.' },
      { title: 'The Little Prince', author: 'Antoine de Saint-Exupéry', color: '#7a5a3a',
        quote: 'It is only with the heart that one can see rightly.' },
      { title: 'Man\'s Search for Meaning', author: 'Viktor Frankl', color: '#2f4a4a',
        quote: 'Everything can be taken from a man but one thing: the last of the human freedoms.' },
      { title: 'The Old Man and the Sea', author: 'Ernest Hemingway', color: '#5a3020',
        quote: 'But man is not made for defeat. A man can be destroyed but not defeated.' },
      { title: 'Siddhartha', author: 'Hermann Hesse', color: '#7c5a2a',
        quote: 'Wisdom cannot be imparted. Wisdom that a wise man attempts to impart always sounds like foolishness.' },
      { title: 'The Stranger', author: 'Albert Camus', color: '#2a2a2f',
        quote: 'In the depth of winter, I finally learned that within me there lay an invincible summer.' },
      { title: 'A Little Life', author: 'Hanya Yanagihara', color: '#5a2d2d',
        quote: 'Things get broken, and sometimes they get repaired, and in most cases, you realize that no matter what gets damaged, life rearranges itself to compensate for your loss.' },
      { title: 'Sapiens', author: 'Yuval Noah Harari', color: '#3a5c6b',
        quote: 'You could never convince a monkey to give you a banana by promising him limitless bananas after death.' },
      { title: 'Steppenwolf', author: 'Hermann Hesse', color: '#3b2a4a',
        quote: 'Only within yourself exists that other reality for which you long.' },
      { title: 'The Poetry of Ki Hyung-do', author: '기형도', color: '#4a3830',
        quote: 'I have lived through a life that was mostly rain.' },
      { title: 'Beloved', author: 'Toni Morrison', color: '#6a2a2a',
        quote: 'Freeing yourself was one thing; claiming ownership of that freed self was another.' },
    ];

    document.addEventListener('DOMContentLoaded', () => {
      const shelf = document.getElementById('bookshelf');
      const reveal = document.getElementById('quoteReveal');

      BOOKS.forEach((b, i) => {
        const spine = document.createElement('div');
        spine.className = 'book-spine';
        spine.style.background = b.color;
        spine.style.width = (34 + Math.floor(Math.random() * 20)) + 'px';
        spine.setAttribute('data-artwork', '');
        spine.textContent = b.title;
        spine.title = b.title + ' — ' + b.author;
        spine.addEventListener('click', () => showQuote(b, spine));
        shelf.appendChild(spine);
      });

      function showQuote(book, spine) {
        document.querySelectorAll('.book-spine.active').forEach((el) => el.classList.remove('active'));
        spine.classList.add('active');
        reveal.style.opacity = 0;
        setTimeout(() => {
          reveal.innerHTML = `
            <div>
              <blockquote>&ldquo;${book.quote}&rdquo;</blockquote>
              <cite>${book.title} · ${book.author}</cite>
            </div>
          `;
          reveal.style.opacity = 1;
        }, 300);
      }

      Gallery.initExit('g2', 'gallery3.html');
    });
  </script>
</body>
</html>
