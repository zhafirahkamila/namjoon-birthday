<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indigo Museum — A Birthday Exhibition for Kim Namjoon</title>
  <meta name="description" content="A fanmade virtual museum celebrating Kim Namjoon's birthday. Explore seven galleries at your own pace." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-page="home">
  <main>
    <section class="hero" id="hero">
      <div class="hero__bg slow-zoom"></div>
      <div class="hero__sunlight"></div>
      <div class="dust-layer" id="heroDust"></div>

      <div class="hero__content">
        <h1 class="hero__title" data-anim="blur-reveal">
          <small data-anim="fade-slow" data-anim-delay="1">Now Exhibiting</small>
          INDIGO<br>MUSEUM
        </h1>
        <p class="hero__sub" data-anim="blur-reveal" data-anim-delay="2">
          A Birthday Exhibition for Kim&nbsp;Namjoon
        </p>
        <p class="hero__date" data-anim="fade-slow" data-anim-delay="3">12 · September · 1994</p>

        <div class="hero__cta" data-anim="rise" data-anim-delay="4">
          <button class="btn" id="beginBtn">
            <span>Begin Exhibition</span>
            <span class="btn-arrow">→</span>
          </button>
        </div>
      </div>

      <div class="hero__scroll" data-anim="fade-slow" data-anim-delay="5">Step through when you are ready</div>
    </section>
  </main>

  <div class="door-overlay" id="doors">
    <div class="door door--left"></div>
    <div class="door door--right"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.42/bundled/lenis.min.js"></script>

  <script src="js/animation.js"></script>
  <script src="js/stamps.js"></script>
  <script src="js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Animation.dust(document.getElementById('heroDust'), 30);

      const beginBtn = document.getElementById('beginBtn');
      const doors = document.getElementById('doors');

      // Doors start closed in CSS; auto-open shortly after paint so the hero
      // is revealed as a museum entrance moment.
      requestAnimationFrame(() => {
        setTimeout(() => doors.classList.add('opening'), 250);
      });

      beginBtn.addEventListener('click', () => {
        beginBtn.disabled = true;
        // Close doors over the hero, then navigate.
        doors.classList.add('active');
        doors.classList.remove('opening');

        try {
          const a = new Audio('assets/audio/door.mp3');
          a.volume = 0.5;
          a.play().catch(() => {});
        } catch (e) {}

        setTimeout(() => {
          window.location.href = 'lobby.html';
        }, 1900);
      });
    });
  </script>
</body>
</html>
